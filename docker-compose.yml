services:

  kafka:
    image: apache/kafka:4.0.1
    container_name: streamforge-kafka
    restart: unless-stopped

    ports:
      - "9092:9092"

    environment:

      # ==========================================
      # Kafka KRaft Configuration
      # ==========================================

      KAFKA_NODE_ID: "1"

      KAFKA_PROCESS_ROLES: "broker,controller"

      KAFKA_CONTROLLER_QUORUM_VOTERS: "1@kafka:9093"


      # ==========================================
      # Kafka Listeners
      #
      # INTERNAL:
      # Docker containers -> Kafka
      #
      # EXTERNAL:
      # Windows/Python -> Kafka
      # ==========================================

      KAFKA_LISTENERS: "CONTROLLER://:9093,INTERNAL://:29092,EXTERNAL://:9092"

      KAFKA_ADVERTISED_LISTENERS: "INTERNAL://kafka:29092,EXTERNAL://localhost:9092"

      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: "CONTROLLER:PLAINTEXT,INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT"

      KAFKA_INTER_BROKER_LISTENER_NAME: "INTERNAL"

      KAFKA_CONTROLLER_LISTENER_NAMES: "CONTROLLER"


      # ==========================================
      # Single-Broker Development Configuration
      # ==========================================

      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: "1"

      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: "1"

      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: "1"

      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: "0"


      # ==========================================
      # Topic Management
      #
      # StreamForge topic_manager.py will create
      # topics explicitly with the correct
      # partition configuration.
      # ==========================================

      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"


      # ==========================================
      # Kafka Performance Configuration
      # ==========================================

      KAFKA_NUM_NETWORK_THREADS: "3"

      KAFKA_NUM_IO_THREADS: "8"

      KAFKA_SOCKET_SEND_BUFFER_BYTES: "102400"

      KAFKA_SOCKET_RECEIVE_BUFFER_BYTES: "102400"

      KAFKA_SOCKET_REQUEST_MAX_BYTES: "104857600"


      # ==========================================
      # Log Retention
      # ==========================================

      KAFKA_LOG_RETENTION_HOURS: "24"

      KAFKA_LOG_SEGMENT_BYTES: "1073741824"


    # ==========================================
    # Kafka Health Check
    # ==========================================

    healthcheck:

      test:
        [
          "CMD-SHELL",
          "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 >/dev/null 2>&1"
        ]

      interval: 5s

      timeout: 5s

      retries: 20

      start_period: 10s